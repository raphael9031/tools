<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src blob: data:; connect-src https://cdn.jsdelivr.net wss://broker.hivemq.com:8884; worker-src blob:; base-uri 'none'; form-action 'none'">
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<title>Tools</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--line:#ccc;--btn:#e4e4e4;--sel:#eee}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#999;--line:#444;--btn:#2c2c2c;--sel:#262626}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
#app{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 12px}
label{display:block;margin:10px 0 3px;color:var(--mut);font-size:12px}
input,select,button{font:inherit;color:var(--fg)}
input[type=number],input[type=text],select{width:100%;height:28px;padding:2px 5px;border:1px solid var(--line);background:var(--bg)}
button{height:28px;padding:0 12px;border:1px solid var(--line);background:var(--btn);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid label{margin-top:0}
.drop{display:block;margin:0 0 4px;padding:26px 10px;border:1px dashed var(--line);text-align:center;color:var(--mut);cursor:pointer}
.drop.on{background:var(--sel)}
.chk{display:flex;align-items:center;gap:6px;margin:10px 0 0;color:var(--fg);font-size:14px}
input[type=range]{width:100%}
.bar{display:flex;gap:8px;align-items:center;margin:14px 0 8px}
.bar span{flex:1;color:var(--mut)}
.it{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.it img{width:48px;height:48px;object-fit:cover;border:1px solid var(--line);flex:none}
.it div{flex:1;min-width:0;overflow-wrap:anywhere}
.it small{display:block;color:var(--mut)}
.it a{color:var(--fg)}
.err{color:#c33}
.tabs{display:flex;border:1px solid var(--line);margin-bottom:14px}
.tabs button{flex:1;height:32px;border:0;border-right:1px solid var(--line);background:var(--bg)}
.tabs button:last-child{border-right:0}
.tabs button.on{background:var(--sel);font-weight:700}
h2{font-size:15px;margin:16px 0 8px}
.it select{width:96px;flex:none}
#cStat{flex:1}
.bar input{flex:1;min-width:0}
#sCode{font:700 22px monospace;letter-spacing:2px;margin:6px 0}
#rStat{color:var(--mut);margin:6px 0}
</style>
</head>
<body>
<div id="app">
  <div class="tabs"><button id="tabI" class="on">Images</button><button id="tabC">Convert</button><button id="tabS">Share</button></div>
  <div id="tImg">
  <label class="drop" id="drop" for="file">Drop images here or click to choose</label>
  <input id="file" type="file" accept="image/*" multiple hidden>

  <div class="grid">
    <div><label for="fmt">Format</label><select id="fmt"></select></div>
    <div><label for="q" id="qLab">Quality 80</label><input id="q" type="range" min="1" max="100" value="80"></div>
    <div><label for="pct">Scale %</label><input id="pct" type="number" min="1" max="1000" placeholder="100"></div>
    <div><label for="w">Width px</label><input id="w" type="number" min="1" max="16384"></div>
    <div><label for="h">Height px</label><input id="h" type="number" min="1" max="16384"></div>
    <div class="chk"><input id="ratio" type="checkbox" checked><label for="ratio" style="margin:0;color:inherit;font-size:inherit">Keep ratio</label></div>
  </div>

  <div class="bar"><span id="sum"></span><button id="zip" disabled>Download all (.zip)</button></div>
  <div id="out"></div>
  </div>
  <div id="tConv" hidden>
    <label class="drop" id="cDrop" for="cFile">Drop any files here or click to choose</label>
    <input id="cFile" type="file" multiple hidden>
    <div id="cList"></div>
    <div class="chk" id="cMergeBox" hidden><input id="cMerge" type="checkbox"><label for="cMerge" style="margin:0;color:inherit;font-size:inherit">Merge all images set to PDF into one PDF</label></div>
    <div class="bar"><select id="cQ" style="width:auto"><option value="high" selected>High quality</option><option value="bal">Balanced</option><option value="small">Smaller files</option></select><button id="cGo" disabled>Convert</button><button id="cZip" disabled>Download all (.zip)</button><span id="cStat"></span></div>
  </div>
  <div id="tShare" hidden>
    <h2>Send</h2>
    <label class="drop" id="sDrop" for="sFile">Drop files here or click to choose</label>
    <input id="sFile" type="file" multiple hidden>
    <div id="sList"></div>
    <div class="bar"><button id="sCreate" disabled>Create code</button><button id="sStop" hidden>Stop sharing</button><span id="sStat"></span></div>
    <div id="sCode"></div>
    <h2>Receive</h2>
    <div class="bar"><input id="rCode" type="text" maxlength="9" placeholder="Code" autocomplete="off" spellcheck="false"><button id="rGo">Connect</button><button id="rAll" hidden>Download all</button></div>
    <p id="rStat"></p>
    <div id="rList"></div>
  </div>
</div>
<script>
var $ = function (id) { return document.getElementById(id); };
var TYPES = [["image/jpeg", "JPEG", "jpg"], ["image/png", "PNG", "png"], ["image/webp", "WebP", "webp"], ["image/avif", "AVIF", "avif"]];
var files = [], results = [], run = 0, timer = 0;

(function () {
  var c = document.createElement("canvas"), sel = $("fmt"), o;
  c.width = c.height = 1;
  o = document.createElement("option"); o.value = ""; o.textContent = "Same as input"; sel.appendChild(o);
  TYPES.forEach(function (t) {
    if (t[0] === "image/png" || c.toDataURL(t[0]).indexOf("data:" + t[0]) === 0) {
      o = document.createElement("option"); o.value = t[0]; o.textContent = t[1]; sel.appendChild(o);
    }
  });
})();

function supported(mime) {
  for (var i = 0; i < $("fmt").options.length; i++) if ($("fmt").options[i].value === mime) return true;
  return false;
}
function extOf(mime) { for (var i = 0; i < TYPES.length; i++) if (TYPES[i][0] === mime) return TYPES[i][2]; return "png"; }
function human(n) {
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(2) + " MB";
}
function load(file) {
  return createImageBitmap(file).catch(function () {
    return new Promise(function (res, rej) {
      var u = URL.createObjectURL(file), im = new Image();
      im.onload = function () { URL.revokeObjectURL(u); res(im); };
      im.onerror = function () { URL.revokeObjectURL(u); rej(new Error("Cannot read this image")); };
      im.src = u;
    });
  });
}
function target(sw, sh) {
  var pct = parseFloat($("pct").value), w = parseInt($("w").value, 10), h = parseInt($("h").value, 10), f;
  if (pct > 0) return [Math.round(sw * pct / 100), Math.round(sh * pct / 100)];
  if (w > 0 && h > 0 && !$("ratio").checked) return [w, h];
  if (w > 0 && h > 0) { f = Math.min(w / sw, h / sh); return [Math.round(sw * f), Math.round(sh * f)]; }
  if (w > 0) return [w, Math.round(sh * w / sw)];
  if (h > 0) return [Math.round(sw * h / sh), h];
  return [sw, sh];
}
async function convert(file) {
  var mime = $("fmt").value || file.type, im = await load(file), t, c, g, blob;
  if (!supported(mime)) mime = "image/png";
  t = target(im.width, im.height);
  t[0] = Math.max(1, t[0]); t[1] = Math.max(1, t[1]);
  if (t[0] > 16384 || t[1] > 16384) throw new Error("Too large (max 16384 px)");
  c = document.createElement("canvas");
  c.width = t[0]; c.height = t[1];
  g = c.getContext("2d");
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
  if (mime === "image/jpeg") { g.fillStyle = "#fff"; g.fillRect(0, 0, t[0], t[1]); }
  g.drawImage(im, 0, 0, t[0], t[1]);
  if (im.close) im.close();
  blob = await new Promise(function (r) { c.toBlob(r, mime, parseInt($("q").value, 10) / 100); });
  if (!blob) throw new Error("Browser could not encode this format");
  return { blob: blob, w: t[0], h: t[1], ext: extOf(blob.type) };
}
function baseName(n) { return n.replace(/\.[^.]*$/, "") || "image"; }

async function process() {
  var my = ++run, out = $("out"), i, f, row, r, a;
  results.forEach(function (x) { if (x.url) URL.revokeObjectURL(x.url); });
  results = [];
  out.textContent = "";
  $("zip").disabled = true;
  for (i = 0; i < files.length; i++) {
    f = files[i];
    row = document.createElement("div"); row.className = "it";
    out.appendChild(row);
    try {
      r = await convert(f);
      if (my !== run) return;
      r.name = baseName(f.name) + "." + r.ext;
      r.url = URL.createObjectURL(r.blob);
      r.orig = f.size;
      results.push(r);
      row.innerHTML = "";
      var im = document.createElement("img"); im.src = r.url; im.alt = ""; row.appendChild(im);
      var d = document.createElement("div");
      d.appendChild(document.createTextNode(r.name));
      var sm = document.createElement("small");
      sm.textContent = r.w + "×" + r.h + " · " + human(f.size) + " → " + human(r.blob.size) +
        " (" + (r.blob.size <= f.size ? "-" : "+") + Math.abs(Math.round((1 - r.blob.size / f.size) * 100)) + "%)";
      d.appendChild(sm); row.appendChild(d);
      a = document.createElement("a"); a.href = r.url; a.download = r.name; a.textContent = "Download";
      row.appendChild(a);
    } catch (e) {
      if (my !== run) return;
      row.textContent = "";
      var dd = document.createElement("div"); dd.className = "err";
      dd.textContent = f.name + ": " + (e && e.message ? e.message : "Failed");
      row.appendChild(dd);
    }
  }
  if (my !== run) return;
  var tin = 0, tout = 0;
  results.forEach(function (x) { tin += x.orig; tout += x.blob.size; });
  $("sum").textContent = results.length ? results.length + " file(s): " + human(tin) + " → " + human(tout) : "";
  $("zip").disabled = !results.length;
}
function schedule() { clearTimeout(timer); if (files.length) timer = setTimeout(process, 300); }

function setFiles(list) {
  files = Array.prototype.filter.call(list, function (f) { return f.type.indexOf("image/") === 0; });
  schedule();
}
$("file").onchange = function () { setFiles(this.files); this.value = ""; };
["dragover", "dragenter"].forEach(function (n) { $("drop").addEventListener(n, function (e) { e.preventDefault(); this.classList.add("on"); }); });
["dragleave", "drop"].forEach(function (n) { $("drop").addEventListener(n, function (e) { e.preventDefault(); this.classList.remove("on"); }); });
$("drop").addEventListener("drop", function (e) { setFiles(e.dataTransfer.files); });
["fmt", "w", "h", "pct", "ratio"].forEach(function (id) { $(id).onchange = schedule; });
$("w").oninput = $("h").oninput = $("pct").oninput = schedule;
$("q").oninput = function () { $("qLab").textContent = "Quality " + this.value; schedule(); };

var CRC = (function () {
  var t = [], n, k, c;
  for (n = 0; n < 256; n++) { c = n; for (k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(b) { var c = 0xFFFFFFFF, i; for (i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(items) {
  var enc = new TextEncoder(), parts = [], cen = [], off = 0, used = {};
  items.forEach(function (f) {
    var name = f.name, n = 1, nb, h, dv, c, ch;
    while (used[name]) name = f.name.replace(/(\.[^.]*)$/, " (" + (n++) + ")$1");
    used[name] = 1;
    nb = enc.encode(name); c = crc32(f.data);
    h = new Uint8Array(30 + nb.length); dv = new DataView(h.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true);
    dv.setUint16(12, 33, true); dv.setUint32(14, c, true); dv.setUint32(18, f.data.length, true);
    dv.setUint32(22, f.data.length, true); dv.setUint16(26, nb.length, true); h.set(nb, 30);
    ch = new Uint8Array(46 + nb.length); dv = new DataView(ch.buffer);
    dv.setUint32(0, 0x02014b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 20, true);
    dv.setUint16(8, 0x0800, true); dv.setUint16(14, 33, true); dv.setUint32(16, c, true);
    dv.setUint32(20, f.data.length, true); dv.setUint32(24, f.data.length, true);
    dv.setUint16(28, nb.length, true); dv.setUint32(42, off, true); ch.set(nb, 46);
    parts.push(h, f.data); cen.push(ch); off += h.length + f.data.length;
  });
  var csize = cen.reduce(function (s, x) { return s + x.length; }, 0), end = new Uint8Array(22), dv2 = new DataView(end.buffer);
  dv2.setUint32(0, 0x06054b50, true); dv2.setUint16(8, items.length, true); dv2.setUint16(10, items.length, true);
  dv2.setUint32(12, csize, true); dv2.setUint32(16, off, true);
  return new Blob(parts.concat(cen, [end]), { type: "application/zip" });
}
$("zip").onclick = async function () {
  var items = [], i, buf, u, a;
  for (i = 0; i < results.length; i++) {
    buf = await results[i].blob.arrayBuffer();
    items.push({ name: results[i].name, data: new Uint8Array(buf) });
  }
  u = URL.createObjectURL(makeZip(items));
  a = document.createElement("a"); a.href = u; a.download = "images.zip";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(u); }, 10000);
};
var BROKER = "wss://broker.hivemq.com:8884/mqtt";
var ICE = [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:global.stun.twilio.com:3478" }];
var CH = 65536, PREFIX = "tools-p2p-v1/", ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function noop() {}
function randStr(n) {
  var b = crypto.getRandomValues(new Uint8Array(n)), s = "", i;
  for (i = 0; i < n; i++) s += ALPHA[b[i] % 32];
  return s;
}
function safeName(n) { return String(n).replace(/[\\\/:*?"<>|\u0000-\u001f]/g, "_").slice(0, 200) || "file"; }
function addIce(pc, c) { if (pc.remoteDescription) pc.addIceCandidate(c).catch(noop); else (pc._q = pc._q || []).push(c); }
function flushIce(pc) { (pc._q || []).forEach(function (c) { pc.addIceCandidate(c).catch(noop); }); pc._q = []; }

var mq = null, handlers = {};
function mqConnect() {
  if (mq) return mq;
  mq = mqtt.connect(BROKER, { clean: true, keepalive: 30, reconnectPeriod: 2000, connectTimeout: 15000 });
  mq.on("message", function (topic, payload) {
    var h = handlers[topic], o;
    if (!h) return;
    try { o = JSON.parse(payload.toString()); } catch (e) { return; }
    if (o && typeof o === "object") h(o);
  });
  return mq;
}
function mqOn(topic, fn) { handlers[topic] = fn; mqConnect().subscribe(topic, { qos: 0 }); }
function mqOff(topic) { delete handlers[topic]; if (mq) mq.unsubscribe(topic); }
function mqSend(topic, o) { mqConnect().publish(topic, JSON.stringify(o), { qos: 0 }); }

var send = { files: [], base: "", code: "", peers: {}, last: 0 };
function metaMsg() {
  return JSON.stringify({ t: "meta", files: send.files.map(function (f, i) { return { id: i, name: f.name, size: f.size }; }) });
}
function renderSend(force) {
  var now = Date.now(), list = $("sList"), open = 0, cur = "", id, p, d;
  if (!force && now - send.last < 250) return;
  send.last = now;
  list.textContent = "";
  send.files.forEach(function (f) {
    d = document.createElement("div"); d.className = "it";
    var dv = document.createElement("div"); dv.textContent = f.name;
    var sm = document.createElement("small"); sm.textContent = human(f.size);
    dv.appendChild(sm); d.appendChild(dv); list.appendChild(d);
  });
  for (id in send.peers) {
    p = send.peers[id];
    if (p.dc.readyState === "open") open++;
    if (p.cur) cur = " · sending " + p.cur.name + " " + Math.floor(p.cur.off / Math.max(1, p.cur.size) * 100) + "%";
  }
  $("sCreate").disabled = !send.files.length || !!send.code;
  $("sCreate").hidden = !!send.code;
  $("sStop").hidden = !send.code;
  $("sCode").textContent = send.code ? send.code.slice(0, 4) + "-" + send.code.slice(4) : "";
  $("sStat").textContent = send.code ? (open ? open + " receiver(s) connected" + cur : "Waiting for a receiver…") : "";
}
function closePeer(id) {
  var p = send.peers[id];
  if (!p) return;
  try { p.dc.close(); p.pc.close(); } catch (e) {}
  delete send.peers[id];
  renderSend(true);
}
function onSenderMsg(o) {
  var id = o.from, p;
  if (typeof id !== "string" || !/^[A-Z2-9]{10}$/.test(id)) return;
  p = send.peers[id];
  if (o.t === "hello") {
    if (p) closePeer(id);
    if (Object.keys(send.peers).length >= 10) return;
    startPeer(id);
  } else if (p && o.t === "answer" && typeof o.sdp === "string") {
    p.pc.setRemoteDescription({ type: "answer", sdp: o.sdp }).then(function () { flushIce(p.pc); }).catch(noop);
  } else if (p && o.t === "ice" && o.c) addIce(p.pc, o.c);
}
function startPeer(id) {
  var pc = new RTCPeerConnection({ iceServers: ICE }), dc = pc.createDataChannel("f"), topic = send.base + "/r/" + id;
  var p = { pc: pc, dc: dc, queue: [], busy: false, cur: null };
  send.peers[id] = p;
  dc.binaryType = "arraybuffer";
  pc.onicecandidate = function (e) { if (e.candidate) mqSend(topic, { t: "ice", c: e.candidate }); };
  pc.onconnectionstatechange = function () {
    if (pc.connectionState === "failed" || pc.connectionState === "closed") closePeer(id); else renderSend(true);
  };
  dc.onopen = function () { dc.send(metaMsg()); renderSend(true); };
  dc.onclose = function () { closePeer(id); };
  dc.onmessage = function (e) {
    var o;
    if (typeof e.data !== "string") return;
    try { o = JSON.parse(e.data); } catch (x) { return; }
    if (o.t === "get" && typeof o.id === "number" && send.files[o.id]) { p.queue.push(o.id); runQueue(p); }
  };
  pc.createOffer().then(function (d) { return pc.setLocalDescription(d); })
    .then(function () { mqSend(topic, { t: "offer", sdp: pc.localDescription.sdp }); }).catch(noop);
}
async function runQueue(p) {
  if (p.busy) return;
  p.busy = true;
  while (p.queue.length && p.dc.readyState === "open") {
    try { await sendFile(p, p.queue.shift()); } catch (e) { break; }
  }
  p.busy = false; p.cur = null;
  renderSend(true);
}
function drained(dc) {
  return new Promise(function (r) {
    var t = setInterval(function () {
      if (dc.bufferedAmount < (1 << 20) || dc.readyState !== "open") { clearInterval(t); r(); }
    }, 20);
  });
}
async function sendFile(p, id) {
  var f = send.files[id], dc = p.dc, off = 0, buf, pos;
  p.cur = { name: f.name, off: 0, size: f.size };
  dc.send(JSON.stringify({ t: "start", id: id }));
  while (off < f.size) {
    buf = await f.slice(off, Math.min(off + (4 << 20), f.size)).arrayBuffer();
    pos = 0;
    while (pos < buf.byteLength) {
      if (dc.readyState !== "open") throw new Error("closed");
      if (dc.bufferedAmount > (4 << 20)) await drained(dc);
      if (dc.readyState !== "open") throw new Error("closed");
      dc.send(buf.slice(pos, pos + CH));
      pos += CH;
    }
    off += buf.byteLength;
    p.cur.off = off;
    renderSend();
  }
  dc.send(JSON.stringify({ t: "end", id: id }));
}
function addSendFiles(list) {
  Array.prototype.forEach.call(list, function (f) { send.files.push(f); });
  if (send.code) for (var id in send.peers) if (send.peers[id].dc.readyState === "open") send.peers[id].dc.send(metaMsg());
  renderSend(true);
}
$("sFile").onchange = function () { addSendFiles(this.files); this.value = ""; };
["dragover", "dragenter"].forEach(function (n) { $("sDrop").addEventListener(n, function (e) { e.preventDefault(); this.classList.add("on"); }); });
["dragleave", "drop"].forEach(function (n) { $("sDrop").addEventListener(n, function (e) { e.preventDefault(); this.classList.remove("on"); }); });
$("sDrop").addEventListener("drop", function (e) { addSendFiles(e.dataTransfer.files); });
$("sCreate").onclick = function () {
  if (!send.files.length || send.code) return;
  send.code = randStr(8);
  send.base = PREFIX + send.code;
  mqOn(send.base + "/s", onSenderMsg);
  renderSend(true);
};
$("sStop").onclick = function () {
  Object.keys(send.peers).forEach(closePeer);
  mqOff(send.base + "/s");
  send.code = ""; send.base = "";
  renderSend(true);
};

var recv = { pc: null, dc: null, files: [], q: [], act: null, pumping: false, base: "", topic: "", timer: 0, hello: 0 };
function setProg(i, t) { var e = $("rp" + i); if (e) e.textContent = t; }
function renderRecv() {
  var list = $("rList");
  list.textContent = "";
  recv.files.forEach(function (f, i) {
    var row = document.createElement("div"), d = document.createElement("div"), sm = document.createElement("small"), b = document.createElement("button");
    row.className = "it";
    d.textContent = f.name;
    sm.textContent = human(f.size) + " · ";
    var sp = document.createElement("span"); sp.id = "rp" + i; sm.appendChild(sp);
    d.appendChild(sm);
    b.textContent = "Download";
    b.onclick = function () { reqFile(i, true); };
    row.appendChild(d); row.appendChild(b); list.appendChild(row);
  });
  $("rAll").hidden = !recv.files.length;
